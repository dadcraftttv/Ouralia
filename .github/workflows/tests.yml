# Builds the app and runs the quick test tier on every push and pull request (ROADMAP 22).
# The full tier (the Pd suites, with their timing checks) stays a local step before a push: tools/run_tests.sh
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build the app
        run: ./gradlew --no-daemon assembleDebug
      - name: Quick tests (patch generation, Java logic, permissions and name)
        run: tools/run_tests.sh quick
