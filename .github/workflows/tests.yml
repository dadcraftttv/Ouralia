# On every push to main or sound-kinds, and every pull request: regenerates the patch and fails if the committed one
# differs, builds the app (Debug) and Ouralia Dev (with YAMNet), builds libpd so our dcs objects compile, then runs the quick test tier (ROADMAP 22; review
# finding 6, Nov 4). The full tier (the Pd suites, with their timing checks) stays a local step before a push: tools/run_tests.sh
name: Tests

on:
  push:
    branches: [main, sound-kinds]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Generated patch matches its generator
        run: |
          python3 tools/make_patch.py
          git diff --exit-code -- app/src/main/assets/patches/test_scene.pd \
            || { echo "test_scene.pd is stale: run python3 tools/make_patch.py and commit it"; exit 1; }
      - name: Build the app and Ouralia Dev
        run: ./gradlew --no-daemon assembleDebug assembleDev
      - name: Build libpd (our pinned fork), so the dcs objects compile
        run: tools/build_libpd.sh
      - name: Quick tests (patch generation, Java logic, permissions and name)
        run: tools/run_tests.sh quick
