# On every push to main or sound-kinds, and every pull request: regenerates the patch and fails if the committed one
# differs, builds the app (Debug) and Ouralia Dev (with YAMNet), fetches Pd's headers from our pinned libpd so our dcs objects compile, then runs the quick test tier (ROADMAP 22; review
# finding 6, Nov 4). The full tier (the Pd suites, with their timing checks) stays a local step before a push: tools/run_tests.sh
name: Tests

on:
  push:
    branches: [main, sound-kinds]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Generated patch matches its generator
        run: |
          python3 tools/make_patch.py
          git diff --exit-code -- app/src/main/assets/patches/test_scene.pd \
            || { echo "test_scene.pd is stale: run python3 tools/make_patch.py and commit it"; exit 1; }
      - name: Build the app and Ouralia Dev
        run: ./gradlew --no-daemon assembleDebug assembleDev
      - name: Pd headers from our pinned libpd (build_libpd.sh's commit), so the dcs objects compile
        # Headers only: all of libpd doesn't build with the runner's newer GCC (fiddle~), and the quick tier needs none of it.
        run: |
          COMMIT=$(sed -n 's/^COMMIT=//p' tools/build_libpd.sh)
          git clone -q https://github.com/dadcraftttv/libpd.git tools/.libpd/src
          git -C tools/.libpd/src checkout -q "$COMMIT"
          git -C tools/.libpd/src submodule update -q --init pure-data
      - name: Quick tests (patch generation, Java logic, permissions and name)
        run: tools/run_tests.sh quick
